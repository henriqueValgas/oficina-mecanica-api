spring:
  application:
    name: oficina-mecanica-api

  datasource:
    url: jdbc:postgresql://localhost:5432/oficinamecanicadb
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

kind: Application